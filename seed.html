    ];

    async function seed() {
      const status = document.getElementById('status');
      const log = document.getElementById('log');
      let count = 0;

      status.textContent = '正在寫入 ' + seedData.length + ' 筆資料...';

      for (const spot of seedData) {
        try {
          await db.collection('spots').add({
            ...spot,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          count++;
          const li = document.createElement('li');
          li.textContent = '✅ ' + spot.city + ' - ' + spot.name;
          log.appendChild(li);
        } catch (e) {
          const li = document.createElement('li');
          li.textContent = '❌ ' + spot.name + ': ' + e.message;
          li.style.color = 'red';
          log.appendChild(li);
        }
      }

      status.textContent = '完成！共寫入 ' + count + ' / ' + seedData.length + ' 筆。可以關掉這個頁面了。';
    }

    seed();
  </script>
</body>
</html>
